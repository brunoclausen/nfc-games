# Build check on every branch push and PR. The manual publish-github.sh is
# the single publisher of the GitHub Release (it uploads our tested AppImage).
name: Build check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build AppImage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            g++ \
            make \
            pkg-config \
            libusb-1.0-0-dev \
            imagemagick

      - name: Build AppImage
        run: |
          set -euo pipefail
          # Ubuntu puts libusb under /usr/lib/x86_64-linux-gnu, not /usr/lib64.
          if [[ ! -e /usr/lib64/libusb-1.0.so.0 && -e /usr/lib/x86_64-linux-gnu/libusb-1.0.so.0 ]]; then
            sudo mkdir -p /usr/lib64
            sudo ln -s /usr/lib/x86_64-linux-gnu/libusb-1.0.so.0 /usr/lib64/libusb-1.0.so.0
            if [[ -e /usr/lib/x86_64-linux-gnu/libusb-1.0.so.0.2 ]]; then
              sudo ln -s /usr/lib/x86_64-linux-gnu/libusb-1.0.so.0.2 /usr/lib64/libusb-1.0.so.0.2
            fi
          fi
          NFC_AUTO_INSTALL=0 ./scripts/build-appimage.sh
          ls -lh dist/nfc-games-x86_64.AppImage
          NFC_SKIP_INSTALL=1 ./dist/nfc-games-x86_64.AppImage version