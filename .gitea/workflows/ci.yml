# Full test on Bruno's Gitea (free). Host runner on steam-win11.
name: Full test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Full test
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Installer byggeværktøj
        run: |
          set -euo pipefail
          export PATH="/home/linuxbrew/.linuxbrew/bin:${PATH:-/usr/bin}"
          export PKG_CONFIG_PATH="/home/linuxbrew/.linuxbrew/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          if command -v cmake >/dev/null 2>&1 && command -v g++ >/dev/null 2>&1; then
            echo "nfc: host toolchain ($(command -v cmake), $(command -v g++))"
            exit 0
          fi
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache cmake g++ make pkgconf libusb-dev git
          elif command -v apt-get >/dev/null 2>&1; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends \
              cmake g++ make pkg-config libusb-1.0-0-dev git ca-certificates
          elif command -v dnf >/dev/null 2>&1; then
            dnf install -y cmake gcc-c++ make pkgconf-pkg-config libusb1-devel git
          else
            echo "nfc: ingen apk/apt/dnf på runner" >&2
            exit 1
          fi

      - name: Hent kode
        run: |
          set -euo pipefail
          TOKEN="${{ github.token }}"
          git init
          git remote add origin "http://oauth2:${TOKEN}@192.168.1.3:3002/app/nfc-games.git"
          git fetch --depth 1 origin "${{ github.sha }}"
          git checkout FETCH_HEAD

      - name: Full test
        run: |
          export PATH="/home/linuxbrew/.linuxbrew/bin:${PATH:-/usr/bin}"
          export PKG_CONFIG_PATH="/home/linuxbrew/.linuxbrew/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          chmod +x scripts/full-test.sh scripts/build-appimage.sh scripts/publish-github.sh packaging/AppRun
          ./scripts/full-test.sh

      - name: Upload GitHub
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          NFC_GITHUB_TOKEN: ${{ secrets.NFC_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          chmod +x scripts/publish-github.sh
          # PAT only for the Release asset. Git push uses the local deploy key.
          ./scripts/publish-github.sh
