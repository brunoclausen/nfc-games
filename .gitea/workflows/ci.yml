# CI on Bruno's Gitea (free). Runners: local-runner with ubuntu-latest.
# Do not use GitHub-hosted Actions.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: CMake and tests
    runs-on: ubuntu-latest
    steps:
      - name: Installer byggeværktøj
        run: |
          set -euo pipefail
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache cmake g++ make pkgconf libusb-dev git
          elif command -v apt-get >/dev/null 2>&1; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends \
              cmake g++ make pkg-config libusb-1.0-0-dev git ca-certificates
          elif command -v dnf >/dev/null 2>&1; then
            dnf install -y cmake gcc-c++ make pkgconf-pkg-config libusb1-devel git
          else
            echo "nfc: ingen apk/apt/dnf på runner" >&2
            exit 1
          fi

      - name: Hent kode
        run: |
          set -euo pipefail
          TOKEN="${{ github.token }}"
          git init
          git remote add origin "http://oauth2:${TOKEN}@192.168.1.3:3002/app/nfc-games.git"
          git fetch --depth 1 origin "${{ github.sha }}"
          git checkout FETCH_HEAD

      - name: CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Byg
        run: cmake --build build -j "$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure
